[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "musfirofficial", email = "musfirofficial@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "greenlet>=3.5.6",
    "groq>=1.7.0",
    "httpx[http2]>=0.28.1",
    "llama-index>=0.14.25",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-fastembed>=0.7.0",
    "llama-index-llms-groq>=0.6.1",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
